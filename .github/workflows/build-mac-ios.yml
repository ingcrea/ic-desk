name: Compilar e Instalables (.dmg & .ipa)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apple-packages:
    name: Compilar e Instalables (.dmg & .ipa)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

          # El paso de certificados globales fue eliminado para inyectarlos localmente en cada paso de compilación

      - name: Seleccionar Xcode y Swift
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Generar Icono Nactivo AppIcon.icns
        run: |
          chmod +x Mac/make_icon.sh
          bash Mac/make_icon.sh || true

      - name: Compilar Aplicación Ejecutable macOS (.app) e Imagen de Disco (.dmg)
        run: |
          cd Mac
          swift build -c release
          
          # 1. Crear la estructura oficial de App Bundle
          mkdir -p "IC-Desk.app/Contents/MacOS"
          mkdir -p "IC-Desk.app/Contents/Resources"
          
          # 2. Copiar binario ejecutable y asignar permisos de ejecución (+x)
          cp .build/release/ICDesk "IC-Desk.app/Contents/MacOS/IC-Desk"
          chmod +x "IC-Desk.app/Contents/MacOS/IC-Desk"
          
          # 3. Generar y copiar icono de la app para macOS
          if [ -f "../logo-texto-blanco.png" ]; then
            mkdir -p AppIcon.iconset
            sips -z 16 16     ../logo-texto-blanco.png --out AppIcon.iconset/icon_16x16.png
            sips -z 32 32     ../logo-texto-blanco.png --out AppIcon.iconset/icon_16x16@2x.png
            sips -z 32 32     ../logo-texto-blanco.png --out AppIcon.iconset/icon_32x32.png
            sips -z 64 64     ../logo-texto-blanco.png --out AppIcon.iconset/icon_32x32@2x.png
            sips -z 128 128   ../logo-texto-blanco.png --out AppIcon.iconset/icon_128x128.png
            sips -z 256 256   ../logo-texto-blanco.png --out AppIcon.iconset/icon_128x128@2x.png
            sips -z 256 256   ../logo-texto-blanco.png --out AppIcon.iconset/icon_256x256.png
            sips -z 512 512   ../logo-texto-blanco.png --out AppIcon.iconset/icon_256x256@2x.png
            sips -z 512 512   ../logo-texto-blanco.png --out AppIcon.iconset/icon_512x512.png
            sips -z 1024 1024 ../logo-texto-blanco.png --out AppIcon.iconset/icon_512x512@2x.png
            iconutil -c icns AppIcon.iconset
            cp AppIcon.icns "IC-Desk.app/Contents/Resources/AppIcon.icns"
          fi
          
          # 4. Generar Info.plist completo
          cat << 'EOF' > "IC-Desk.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>IC-Desk</string>
              <key>CFBundleIdentifier</key>
              <string>com.icdesk.ingcrea</string>
              <key>CFBundleName</key>
              <string>IC Desk</string>
              <key>CFBundleDisplayName</key>
              <string>IC Desk</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>4.0.0</string>
              <key>CFBundleVersion</key>
              <string>4.0.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF

          # 5. Firma de Código Nactiva
          CERTIFICATE_PATH=icdesk_certificate.p12
          P12_PASSWORD="S3rC0mMx"
          
          echo "Asegurando llavero para macOS..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build-macos.keychain-db
          security create-keychain -p "github" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "github" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o AppleWWDRCAG6.cer
          security import AppleWWDRCAG6.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

          echo "Importando certificado p12..."
          ls -la $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "github" $KEYCHAIN_PATH

          codesign --force --deep --options runtime --sign "E50547864E8CC3AD7E82571FA11F6FF43FC167E6" "IC-Desk.app"
          echo "Aplicación IC-Desk.app firmada con certificado de distribución forzado."

          # 6. Crear Instalador Nativo .dmg
          mkdir -p dmg_stage
          cp -R IC-Desk.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "IC Desk" -srcfolder dmg_stage -ov -format UDZO IC-Desk-macOS.dmg
          echo "Imagen de disco ejecutable IC-Desk-macOS.dmg creada con éxito."

      - name: Generar Paquete Instalable de iOS (.ipa)
        run: |
          cd Mac
          echo "Compilando binario ARM64 para iOS usando xcodebuild..."
          xcodebuild -scheme ICDesk -destination "generic/platform=iOS" -configuration Release SYMROOT="$(pwd)/.build/ios_build"
          
          mkdir -p "Payload/ICDesk.app"
          
          echo "Empaquetando ejecutable..."
          cp .build/ios_build/Release-iphoneos/ICDesk "Payload/ICDesk.app/ICDesk"
          chmod +x "Payload/ICDesk.app/ICDesk"
          
          # Generar Info.plist requerido para iOS
          cat << 'EOF' > "Payload/ICDesk.app/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>es</string>
              <key>CFBundleExecutable</key>
              <string>ICDesk</string>
              <key>CFBundleIdentifier</key>
              <string>com.icdesk.ingcrea</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>IC Desk</string>
              <key>CFBundleDisplayName</key>
              <string>IC Desk</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>4.1.8</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>UIPrerenderedIcon</key>
                      <true/>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF
          
          # Generar archivo PkgInfo estricto para iOS
          echo -n "APPL????" > "Payload/ICDesk.app/PkgInfo"
          
          # Generar y copiar icono de iOS
          if [ -f "../logo-texto-blanco.png" ]; then
            sips -z 120 120 "../logo-texto-blanco.png" --out "Payload/ICDesk.app/AppIcon60x60@2x.png"
            sips -z 180 180 "../logo-texto-blanco.png" --out "Payload/ICDesk.app/AppIcon60x60@3x.png"
          fi
          
          # Agregar Provisioning Profile si existe
          if [ -f "ICDesk_USB_AdHoc.mobileprovision" ]; then
            cp ICDesk_USB_AdHoc.mobileprovision "Payload/ICDesk.app/embedded.mobileprovision"
          fi
          
          # Firmar la app con los entitlements del perfil de provisión
          CERTIFICATE_PATH=icdesk_certificate.p12
          P12_PASSWORD="S3rC0mMx"
          
          echo "Asegurando llavero para iOS..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build-ios.keychain-db
          security create-keychain -p "github" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "github" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          curl -sL https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o AppleWWDRCAG6.cer
          security import AppleWWDRCAG6.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

          echo "Importando certificado p12..."
          ls -la $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "github" $KEYCHAIN_PATH

          echo "Extrayendo entitlements del perfil de provisión..."
          security cms -D -i ICDesk_USB_AdHoc.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" profile.plist > entitlements.plist
          codesign --force --generate-entitlement-der --sign "E50547864E8CC3AD7E82571FA11F6FF43FC167E6" --entitlements entitlements.plist "Payload/ICDesk.app"
          
          # Empaquetar
          zip -qr IC-Desk-iOS.ipa Payload
          echo "Paquete IC-Desk-iOS.ipa generado correctamente."

      - name: Subir Artefactos Temporales de Acción
        uses: actions/upload-artifact@v4
        with:
          name: IC-Desk-macOS-DMG
          path: Mac/IC-Desk-macOS.dmg

      - name: Subir Artefacto de iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: IC-Desk-iOS-IPA
          path: Mac/IC-Desk-iOS.ipa

      - name: Publicar Release Oficial en GitHub (.dmg & .ipa)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.1.28
          name: IC Desk Release v4.1.28 (macOS & iOS)
          body: |
            ## IC Desk v4.1.28 - Fix JSON parsing in HTTP command poll
            - **macOS Installer**: `IC-Desk-macOS.dmg` (Imagen de disco ejecutable nativa `.dmg` con icono `AppIcon.icns` y permisos `chmod +x`)
            - **iOS App**: `IC-Desk-iOS.ipa` (Paquete instalable nativo `.ipa`)
          files: |
            Mac/IC-Desk-macOS.dmg
            Mac/IC-Desk-iOS.ipa
